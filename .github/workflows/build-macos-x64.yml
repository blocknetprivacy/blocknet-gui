name: Build macOS x86_64

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos-x64:
    # Native Intel runner. macos-13 was retired 2025-12; macos-15-intel replaces
    # it and is supported until Aug 2027. After that, switch to an arm64 runner
    # and cross-compile with --target x86_64-apple-darwin (the daemon sidecar is
    # already committed, so only the Rust side needs cross-compiling).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Validate version sync from daemon
        run: |
          chmod +x src-tauri/binaries/blocknet-x86_64-apple-darwin
          BLOCKNET_BIN="src-tauri/binaries/blocknet-x86_64-apple-darwin" npm run --silent sync:version:check

      - name: Export version from VERSION file
        run: echo "DAEMON_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Build Tauri app
        run: npx tauri build --target x86_64-apple-darwin --config '{"bundle":{"targets":["app"],"resources":["binaries/blocknet-x86_64-apple-darwin"]}}'

      - name: Ad-hoc sign and remove quarantine
        run: |
          APP_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/blocknet.app"
          chmod +x "$APP_PATH/Contents/Resources/binaries/blocknet-x86_64-apple-darwin"
          codesign --force --deep --sign - "$APP_PATH"
          xattr -cr "$APP_PATH"

      - name: Package
        run: |
          mkdir -p dist
          APP_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/blocknet.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "dist/blocknet-x86_64-darwin-${DAEMON_VERSION}.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: blocknet-macos-x64
          path: dist/*
