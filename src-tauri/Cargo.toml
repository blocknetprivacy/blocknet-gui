[package]
name = "blocknet-wallet"
version = "0.22.0"
description = "Blocknet Wallet"
authors = ["Blocknet Privacy"]
license = "BSD-3-Clause"
repository = "https://github.com/blocknetprivacy/blocknet-tauri"
edition = "2021"

[lib]
name = "blocknet_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "macos-system-configuration"] }
dirs-next = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"

[target."cfg(not(target_os = \"android\"))".dependencies]
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }

[target."cfg(target_os = \"android\")".dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-barcode-scanner = "2"

[target."cfg(unix)".dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

